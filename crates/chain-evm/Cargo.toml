[package]
name = "shadowallet-chain-evm"
version = "0.1.0-alpha.2"
edition.workspace = true
rust-version = "1.88"
license.workspace = true
description = "EVM account derivation, RPC, ERC-20 and external transaction signing."
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/shadowallet-chain-evm"
readme = "../../README.md"
keywords = ["ethereum", "evm", "wallet", "transaction"]
categories = ["cryptography", "finance"]

[dependencies]
bytes.workspace = true
hex.workspace = true
primitive-types.workspace = true
rlp.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
bip32.workspace = true
sha3.workspace = true
secp256k1.workspace = true
thiserror.workspace = true
url = "2"
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
bip39 = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
