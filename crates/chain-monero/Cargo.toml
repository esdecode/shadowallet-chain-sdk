[package]
name = "shadowallet-chain-monero"
version = "0.1.0-alpha.1"
edition.workspace = true
rust-version = "1.89"
license.workspace = true
description = "Monero account derivation (BIP-44 m/44'/128'), subaddresses, wallet scanning and RingCT transaction construction on top of monero-oxide."
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["monero", "wallet", "ringct"]
categories = ["cryptography", "finance"]

[dependencies]
shadowallet-chain-securedb = { path = "../chain-securedb", version = "0.1.0-alpha.1" }
monero-wallet = "0.2.0"
monero-daemon-rpc = "0.2.0"
hex.workspace = true
bip32.workspace = true
thiserror.workspace = true
zeroize = "1"
crc32fast = "1"
curve25519-dalek = "4"
rand_core = { version = "0.6", features = ["getrandom"] }
sha3.workspace = true
rusqlite.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
reqwest = { workspace = true, features = ["socks"] }
serde_json.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
tempfile = "3"
bip39 = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
monero-wallet = "0.2.0"

[features]
# Compile-time opt-in that lifts the three engine-level refusals to prepare, sign and publish on Monero MAINNET (off by default).
# It grants nothing by itself: the wallet native policy and one-shot authorization still decide.
mainnet-send = []

[lints]
workspace = true
