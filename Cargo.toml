[workspace]
resolver = "2"
exclude = ["vendor/rusqlite"]
members = [
    "crates/chain-core",
    "crates/chain-utxo",
    "crates/chain-litecoin",
    "crates/chain-bitcoin",
    "crates/chain-dogecoin",
    "crates/chain-bitcoin-cash",
    "crates/chain-evm",
    "crates/chain-solana",
    "crates/chain-tron",
    "crates/chain-monero",
    "crates/chain-zcash",
    "crates/chain-nano",
    "vendor/monero-ed25519",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/esdecode/shadowallet-chain-sdk"
homepage = "https://github.com/esdecode/shadowallet-chain-sdk"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
bdk_bitcoind_rpc = "0.22.1"
bdk_wallet = { version = "3.2.0", features = ["keys-bip39"] }
bdk_chain = { version = "0.23.4", features = ["serde"] }
bdk_esplora = { version = "0.22.3", default-features = false, features = ["std", "async-https-rustls", "tokio"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
litecoin = "=0.32.8-rc.1"
doge = { package = "bitcoin-dogecoin", version = "=0.32.7-doge.0" }
bitcoin = "0.32"
bytes = "1"
primitive-types = "0.13"
rlp = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
bip32 = { version = "0.6", features = ["alloc"] }
sha3 = "0.10"
tokio = { version = "1", features = ["rt", "net", "time"] }
secp256k1 = { version = "0.31", features = ["recovery", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# monero-ed25519 0.1.0 pulls crypto-bigint 0.5.5 (RUSTSEC-2026-0387). The vendored copy is identical except for
# Point::biased_hash, ported to crypto-bigint 0.7 and checked against 4000 vectors of the original.
[patch.crates-io]
monero-ed25519 = { path = "vendor/monero-ed25519" }
# RUSTSEC-2026-0459: zcash_client_sqlite pins rusqlite 0.37, whose libsqlite3-sys 0.35 bundles a vulnerable SQLite.
# The vendored rusqlite 0.37.0 is unmodified except for its libsqlite3-sys requirement (0.39 = bundled SQLite 3.54.1).
rusqlite = { path = "vendor/rusqlite" }
